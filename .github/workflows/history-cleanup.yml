name: History cleanup (one-off, 23 Oct 2026)
# One-off after the history rewrite of 23 Oct 2026 (sensitive data removed from all commits, README section 10).
# main was rewritten and force-pushed from a Claude session; the session cannot write any other ref, so this job:
#  1. rebuilds logo-video-src on the rewritten history (same video file, checked by its blob id),
#  2. re-points the tag before-portal-v2-2026-10-05 to the rewritten commit,
#  3. deletes the old routine branches claude/* and zz-wf-scope-probe - their content was published to main long ago,
#     and they still carry the old history.
# Run once by hand (Actions -> this workflow -> Run workflow); delete this file afterwards.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild logo-video-src, re-point the tag, delete old branches
        run: |
          set -euo pipefail
          git config user.name "Piotr Wiśniewski"
          git config user.email "37083541+wpiotrw@users.noreply.github.com"
          NEW_PARENT=ea0b926f85694c71816c9630124f39f9f237662e   # rewritten "data: campaigns and KQL archive 2026-10-15 21:28 UTC"
          TAG_COMMIT=88b17a2ad6910f376bd8ba89b1a35e0568c9870f   # rewritten commit of the tag
          MP4_BLOB=2e778bfe2d672075232e4cc4f97508cb3cb87873
          git merge-base --is-ancestor "$NEW_PARENT" origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          # 1. logo-video-src
          git fetch origin logo-video-src:old-logo
          test "$(git rev-parse old-logo:assets-src/guardzilla_movie.mp4)" = "$MP4_BLOB"
          git checkout -q -b new-logo "$NEW_PARENT"
          mkdir -p assets-src
          git show "old-logo:assets-src/guardzilla_movie.mp4" > assets-src/guardzilla_movie.mp4
          git add assets-src/guardzilla_movie.mp4
          test "$(git rev-parse :assets-src/guardzilla_movie.mp4)" = "$MP4_BLOB"
          GIT_AUTHOR_DATE="2026-10-16T12:00:00+02:00" git commit -q -m "assets-src: oryginalny film logo GUARDZILLA"
          git push --force origin new-logo:refs/heads/logo-video-src
          # 2. tag
          git tag -f -a before-portal-v2-2026-10-05 -m "Stan przed etapami planu portal v2 (5 X 2026)" "$TAG_COMMIT"
          git push --force origin refs/tags/before-portal-v2-2026-10-05
          # 3. old branches
          for b in $(git ls-remote --heads origin 'claude/*' | awk '{print $2}') refs/heads/zz-wf-scope-probe; do
            git push origin --delete "$b" || echo "could not delete $b"
          done
          echo "Remaining refs:"; git ls-remote origin
