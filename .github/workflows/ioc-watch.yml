name: IOC watch

# CLAUDE.md 5fb (23 X 2026): the infrastructure of our incidents - domains and IPs from the analyses, look-alike
# certificates (crt.sh), checked in VirusTotal, GreyNoise, URLhaus and ThreatFox (ti_sources.json, README section 16).
# Writes site/data/ioc-watch.json and site/data/ioc-watch-history.json; commits when something changed. The keys are
# repository secrets - a missing one means that source is skipped and named in the file, never a failed job.
# A push made with GITHUB_TOKEN starts no other workflow, so "Code refresh" deploys the site after this one.
on:
  schedule:
    - cron: "25 6 * * *"     # after the morning routine and its threat notes
    - cron: "25 18 * * *"
  push:
    branches: [main]
    paths:
      - 'tools/ioc_watch.py'
      - 'ti_sources.json'
      - 'community_posts.json'
      - '.github/workflows/ioc-watch.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # 5fc: Microsoft Threat Intelligence host reputation - the GitHub OIDC token signs in the tenant app

# 5fj (25 X 2026): NOT in the swa-deploy group any more. This job deploys nothing (its push uses GITHUB_TOKEN and starts
# no workflow) and runs ~30 min (VirusTotal 4/min), so holding the group blocked every deploy behind it - and GitHub
# keeps only ONE pending run per group: on 25 X 22:17 Warsaw both "Publish routine output" runs of the evening
# routine were cancelled by newer pending runs while this job held the group. Own group: one IOC watch at a time.
concurrency:
  group: ioc-watch
  cancel-in-progress: false

jobs:
  ioc-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Which keys this run has (names only, never values)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          GREYNOISE_API_KEY: ${{ secrets.GN_API_KEY || secrets.GREYNOISE_API_KEY }}
        run: |
          for k in VT_API_KEY ABUSECH_AUTH_KEY GREYNOISE_API_KEY; do
            if [ -n "${!k}" ]; then echo "$k: set"; else echo "$k: NOT SET"; fi
          done
      - name: OCR for images in researchers' posts (CLAUDE.md 5ff)
        run: sudo apt-get install -y -q tesseract-ocr >/dev/null 2>&1 || echo "tesseract not installed - post images are skipped"
      - name: Check the indicators (CLAUDE.md 5fb, 5fc)
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          GREYNOISE_API_KEY: ${{ secrets.GN_API_KEY || secrets.GREYNOISE_API_KEY }}
        run: timeout 2100 python3 tools/ioc_watch.py || true
      - name: Commit when it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/ioc-watch.json site/data/ioc-watch-history.json cache/ioc-pages.json cache/x-posts.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; else
            python3 tools/stamp.py iocwatch || true; git add site/data/fresh
            git commit -m "data: IOC watch $(date -u +%F' '%H:%M) UTC"
            for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin main && break; echo "push race, retry $i"; sleep $((i*10)); done
          fi
