name: Publish routine output

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swa-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Merge to main and deploy
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Take site/ from the routine branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+${GITHUB_REF}:refs/remotes/origin/routine"
          # CLAUDE.md 5he (22 XI 2026): take ONLY the files the routine changed since it branched from main.
          # Before, `rm -rf site` + checkout of the whole branch rolled back everything main received while the
          # routine ran - on 22 XI the evening publish deleted an incident note, five archived KQL files, their rows in
          # site/kql/index.json and threats.json; 4 of the 12 publishes 16-22 XI lost files the same way.
          R=refs/remotes/origin/routine
          if BASE=$(git merge-base HEAD "$R"); then
            git diff --name-only -z --diff-filter=d "$BASE" "$R" -- site | xargs -0 -r git checkout "$R" --
            git diff --name-only -z --diff-filter=D "$BASE" "$R" -- site | xargs -0 -r git rm -q --ignore-unmatch --
            echo "routine changed $(git diff --name-only "$BASE" "$R" -- site | wc -l) file(s) under site/ since $BASE"
          else
            echo "::warning title=No merge base::the routine branch shares no history with main - whole site/ taken from it"
            rm -rf site
            git checkout "$R" -- site
          fi
          # CLAUDE.md 5cz: the stamps belong to the workflows that write them - a routine clone may be older,
          # so keep main's copies (rm -rf above would drop or roll them back), then stamp this publication
          git checkout HEAD -- site/data/fresh 2>/dev/null || true
          if ! git diff --quiet HEAD -- site; then python3 tools/stamp.py publish "${GITHUB_REF_NAME}" || true; fi
          # CLAUDE.md 5eq: a routine writes its page to site/diff/index.html (evening) or site/week/index.html (morning);
          # the "What changed" app takes those addresses and the routine's page moves to diff/full.html / week/print.html
          python3 tools/changes_page.py site || true
          git add -A site
          if git diff --cached --quiet; then
            echo "Brak zmian w site/ - nie commituje."
          else
            git commit -m "content: publikacja z ${GITHUB_REF_NAME}"
            # CLAUDE.md 5hg (23 XI 2026): another workflow can push to main while this one runs - the morning publish
            # of 23 XI was rejected ("fetch first") and nothing went live. Rebase onto the new main and try again;
            # on a conflict the routine's version of the files it changed wins (-X theirs = the commit being replayed).
            ok=0
            for i in 1 2 3 4 5; do
              if git push origin main; then ok=1; break; fi
              echo "push rejected (attempt $i) - rebasing onto the new main"
              sleep $((i * 5))
              git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            done
            [ "$ok" = 1 ] || { echo "::error title=Publish not pushed::main moved five times while publishing"; exit 1; }
            echo "Zmiany scalone do main."
          fi

      - name: Prepare the deploy copy - data blocks as files (CLAUDE.md 5dl)
        run: python3 tools/deploy_prep.py site _deploy

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_GROUND_019F30603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/_deploy"
          api_location: "api"
          output_location: ""
          skip_app_build: true
