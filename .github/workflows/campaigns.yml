name: Campaign tracking

# CLAUDE.md 5cu (9 X 2026): retirements, enforcements, end of support, changes by default and security
# baselines, followed across every source of the brief by tools/campaigns.py (our own detection, no
# external service). Reads the newest state in site/data, the tenant's Message Center file, the owner's
# corrections (campaigns.json), the watched YouTube channels (youtube_sources.json, public feeds) and the
# Entra Connect version table on Microsoft Learn (public markdown). Writes site/data/campaigns.json and
# site/data/campaigns-history.json; commits only when something changed. A push made with GITHUB_TOKEN
# starts no other workflow, so "Code refresh" deploys the site after this one (workflow_run there).
# 5gf (3 XI 2026): also tools/mc_datecheck.py (dates of the other posts on the same change -> mc-datecheck.json) and
# tools/mc_coverage.py (mc.merill.net, msmessagecenter.com sitemap, DeltaPulse MCP, tenant, portal -> mc-coverage.json).
on:
  schedule:
    - cron: "40 5 * * *"     # after the morning routine (06:00 Warsaw = 04:00 UTC) has been published
    - cron: "40 20 * * *"    # after the afternoon pass
  workflow_run:
    workflows: ["Publish routine output", "First-party apps tenant snapshot"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/campaigns.py'
      - 'tools/mc_datecheck.py'   # 5gf
      - 'tools/mc_coverage.py'    # 5gf
      - 'campaigns.json'
      - 'youtube_sources.json'
      - 'tools/kql_archive.py'
      - 'tools/kql_repos.py'
      - 'tools/kql_extract.py'
      - 'kql_sources.json'
      - '.github/workflows/campaigns.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swa-deploy
  cancel-in-progress: false

jobs:
  campaigns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Detect and update campaigns
        run: python3 tools/campaigns.py
      # CLAUDE.md 5gf (3 XI 2026): dates of the other posts on the same change, and which source knows which MC post
      - name: Cross-check MC dates and source coverage (CLAUDE.md 5gf)
        run: |
          python3 tools/mc_datecheck.py || true
          timeout 600 python3 tools/mc_coverage.py || true
      # CLAUDE.md 5eu (21 X 2026): community KQL repositories (kql_sources.json), once a day; never fails the job
      - name: Community KQL repositories (CLAUDE.md 5eu)
        run: timeout 1500 python3 tools/kql_repos.py || true
      - name: Archive every KQL query - brief, incident notes, articles, community (CLAUDE.md 5l, 5cv-c, 5eu)
        run: python3 tools/kql_archive.py
      - name: Commit when it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/campaigns.json site/data/campaigns-history.json site/kql
          git add site/data/mc-datecheck.json site/data/mc-coverage.json 2>/dev/null || true   # 5gf
          git add cache/kql-repos.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; else
            python3 tools/stamp.py campaigns || true; git add site/data/fresh   # CLAUDE.md 5cz
            git commit -m "data: campaigns and KQL archive $(date -u +%F' '%H:%M) UTC"
            git pull --rebase -q origin main
            git push origin main
          fi
