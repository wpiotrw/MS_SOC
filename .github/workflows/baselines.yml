name: Baselines tracking

# CLAUDE.md 5dv (15 X 2026): what Maester and Tenable test in Microsoft 365, Entra, M365 Apps and AI.
# tools/baselines.py reads Maester's public repository (git clone, test attributes and docs, releases API) and
# Tenable's public audit catalogue (www.tenable.com/audits listings and the audit files in scope of
# baselines_sources.json), compares with the previous run and writes site/data/baselines.json (summary),
# baselines-tests.json (Maester catalogue), baselines-tenable.json (Tenable items) and baselines-history.json.
# Nothing is run against a tenant and no secret is used: GITHUB_TOKEN only raises the GitHub API rate limit.
# 5fq (27 X 2026): tools/baselines_more.py adds CISA ScubaGear (git, baselines/*.md), Microsoft's Zero Trust Assessment
# (git, tests) and the Intune security baselines (our Learn copy in mirror/) -> baselines-controls/-intune/-zta.json.
# 5fw (31 X 2026): tools/baselines_cipp.py adds CIPP's standards (github.com/CyberDrain/CIPP, frontend/src/data/
# standards.json) -> baselines-cipp.json, memory in data/baselines-cipp/; owner: "watch that JSON all the time" - a
# second run in the afternoon.
# Commits only when something changed. A push made with GITHUB_TOKEN starts no other workflow, so
# "Code refresh" deploys the site after this one (workflow_run there).
on:
  schedule:
    - cron: "15 5 * * *"     # once a day, before the morning brief is read
    - cron: "15 15 * * *"    # 5fw: and in the afternoon (CIPP's standards, and whatever else moved since the morning)
  push:
    branches: [main]
    paths:
      - 'tools/baselines.py'
      - 'tools/baselines_more.py'
      - 'tools/baselines_cipp.py'
      - 'baselines_sources.json'
      - '.github/workflows/baselines.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swa-deploy
  cancel-in-progress: false

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read CISA ScubaGear, Maester, Tenable, Zero Trust Assessment, the Intune security baselines and CIPP's standards
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/baselines.py
      - name: Commit when it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/baselines.json site/data/baselines-tests.json site/data/baselines-tenable.json site/data/baselines-history.json
          git add site/data/baselines-controls.json site/data/baselines-intune.json site/data/baselines-zta.json site/data/baselines-more-history.json 2>/dev/null || true   # 5fq
          git add site/data/baselines-cipp.json data/baselines-cipp 2>/dev/null || true   # 5fw
          if git diff --cached --quiet; then echo "No change."; else
            python3 tools/stamp.py baselines || true; git add site/data/fresh   # CLAUDE.md 5cz
            git commit -m "data: security baselines (CISA, Maester, Tenable, ZTA, Intune, CIPP) $(date -u +%F' '%H:%M) UTC"
            git pull --rebase -q origin main
            git push origin main
          fi
